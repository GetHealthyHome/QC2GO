<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="QC2GO">
  <!--
    The QC2GO brandmark: a Q built from a ring split down the middle — orange on
    the left, deep blue closing the right — with the tail as a separate dot
    sitting in the gap where the blue stops short.
  -->
  <g fill="none" stroke-width="19" stroke-linecap="butt">
    <!-- Left half, orange: twelve o'clock round to six, counter-clockwise. -->
    <path d="M48 15 A 31 31 0 0 0 48 77" stroke="#E4632A" />
    <!-- Right half, blue: twelve o'clock clockwise, stopping just short of the tail. -->
    <path d="M48 15 A 31 31 0 0 1 67.9 69.7" stroke="#1B5C7E" />
  </g>
  <!-- The tail, clear of both arcs. -->
  <circle cx="79" cy="79" r="11.5" fill="#E4632A" />
</svg>
