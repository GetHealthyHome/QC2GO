name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # An invalid vercel.json only fails at deploy time, long after CI is green.
      - name: Validate vercel.json
        run: npm run check:vercel

      - name: Typecheck
        run: npm run typecheck

      # A column renamed in a migration but not in the mappers is not a type
      # error — the field just arrives back empty. Only a round trip catches it.
      - name: Check the sync mappers round-trip
        run: npm run check:sync-mappers

      # The invite function is the only code that runs with the service_role
      # key, which bypasses row-level security. Nothing underneath it would
      # catch a mistake, so its decision is a pure function and it is tested.
      - name: Check who may invite whom
        run: npm run check:invite-authorization

      # Byte-level parsing fails quietly: a wrong offset gives a plausible
      # number rather than an error, and a missed hemisphere reference puts a
      # job on the wrong side of the equator.
      - name: Check the EXIF reader
        run: npm run check:exif

      # A mark drawn on a phone has to land in the same place in a report and
      # again on paper. If the geometry drifts, an arrow points at the wrong
      # part of a photo in front of a customer.
      - name: Check the annotation geometry
        run: npm run check:annotations

      # A backoff that does not back off hammers a customer's server; one that
      # gives up too early loses an event somebody was relying on. Neither
      # shows up anywhere until it is expensive.
      - name: Check the webhook retry schedule
        run: npm run check:webhooks

      # A file the office opens once a month is exactly the kind of thing that
      # breaks silently — a comma in an address, a quote in a name, or a value
      # Excel decides is a formula and runs.
      - name: Check the spreadsheet export
        run: npm run check:export

      # Every inspection signed before repeatable sections existed keys its
      # answers by bare question id. If that keying moved, those records would
      # quietly read as unanswered.
      - name: Check repeatable sections
        run: npm run check:sections

      # A share link is a bearer credential handed to somebody with no account,
      # and the function serving it runs with the service key — so row-level
      # security is not underneath it. Every reason to refuse, and every field a
      # reader is allowed to see, is decided in one pure module and asserted here.
      - name: Check who may read a shared report
        run: npm run check:share-access

      # A serial number is what warranty registration is keyed on, and a wrong
      # character is not found until a compressor fails out of warranty. The
      # decoding belongs to the browser; what breaks is everything around it —
      # a detect loop storing forty copies of one plate, or an invisible control
      # character sitting inside a serial that looks perfectly correct.
      - name: Check barcode capture
        run: npm run check:barcode

      # A hidden checkpoint that still counts is the dangerous direction: a
      # blocker naming a question that is nowhere on screen cannot be cleared by
      # anybody, and an answer to a question that was never asked drags down a
      # score nobody can explain.
      - name: Check conditional logic
        run: npm run check:conditions

      # A fraud flag is only worth having if a supervisor still reads it in six
      # months, and every false positive spends that credibility. The ways to
      # generate one are ordinary: a short re-check, a record left open
      # overnight, a walk interrupted by lunch, a GPS fix taken in a basement.
      - name: Check the pencil-whipping heuristics
        run: npm run check:integrity

      # The only code in QC2GO that deletes evidence, with no undo and no second
      # copy on the server. Almost every case here is a case where it must NOT
      # delete — above all, a failed lookup must never read as "no photos
      # exist", which would make every file in the bucket an orphan.
      - name: Check what the photo sweeper may delete
        run: npm run check:sweep

      - name: Build
        run: npm run build

      # Handed to the smoke job so it does not rebuild from scratch.
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  migrations:
    name: Migrations & tenant isolation
    runs-on: ubuntu-latest
    # A policy with a typo still installs, and a policy that admits every
    # signed-in caller still installs. The only way to know one company cannot
    # read another's inspections is to create two and try it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply every migration and prove the tenancy boundary
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: npm run check:migrations

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Server and test share one step: a process backgrounded in an earlier step
      # is not guaranteed to still be running by the time the next one starts.
      - name: Serve the build and run the smoke test
        run: |
          npx vite preview --port 4173 --strictPort &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl -sf http://localhost:4173/ >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4173/ >/dev/null || { echo "preview server never came up"; exit 1; }
          npm run smoke

      # The sign-in gate is the only thing protecting a configured deployment, and
      # nothing else would catch it silently breaking. Dummy credentials are enough:
      # the assertion is that the app is unreachable, not that sign-in succeeds.
      - name: Verify the auth gate blocks a configured build
        env:
          VITE_SUPABASE_URL: https://example-project.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy_key
        run: |
          npx vite build
          npx vite preview --port 4174 --strictPort &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl -sf http://localhost:4174/ >/dev/null && break
            sleep 1
          done
          SMOKE_OUT=smoke-shots npm run check:auth-gate

      # Screenshots are the fastest way to see what a failing run actually looked like.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: smoke-shots
          retention-days: 7
          if-no-files-found: ignore
